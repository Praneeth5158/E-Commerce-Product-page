<!DOCTYPE html>
<html>
    <head>
        <title>E-Commerce Product page</title>
        <link href="styles.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <header class="header">
            <h1 class="name">My E-Commerce Store</h1>
            <nav>
                <i class="fa-solid fa-cart-shopping"></i>
                <i class="fa-solid fa-circle-user"></i>
            </nav>
        </header>
        <div class="products">
            <div class="iphone">
                <img src="iphone.webp">
                <p>Apple iphone 14 <p>
                <p>79,999/-</p>
                <button>Add to Cart</button>
            </div>
              <div class="iphone">
                <img src="laptop.jpeg">
                <p>HP laptop <p>
                <p>39,999/-</p>
                <button>Add to Cart</button>
            </div>
              <div class="iphone">
                <img src="watch.webp">
                <p>Smart Watch<p>
                <p>999/-</p>
                <button>Add to Cart</button>
            </div>
              <div class="iphone">
                <img src="TV.jpeg">
                <p>Smart TV <p>
                <p>11,999/-</p>
                <button>Add to Cart</button>
            </div>
              <div class="iphone">
                <img src="buds.jpeg">
                <p>Apple ear buds<p>
                <p>15,599/-</p>
                <button>Add to Cart</button>
            </div>
              <div class="iphone">
                <img src="helicopter.webp">
                <p>Helicopter<p>
                <p>2,000/-</p>
                <button>Add to Cart</button>
            </div>
              <div class="iphone">
                <img src="cooker.webp">
                <p>Pigeon special cooker<p>
                <p>1,099/-</p>
                <button>Add to Cart</button>
            </div>
              <div class="iphone">
                <img src="realme buds.webp">
                <p>Realme buds <p>
                <p>10,999/-</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </body>
</html>
